<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#070c13" />
    <title>DriveData Deck: escolha o que levar</title>
    <meta name="description" content="Combos e cartas avulsas do DriveData Deck, com preço em dólar." />
    <link rel="stylesheet" href="/oferta.css" />
    <link rel="stylesheet" href="/loja.css" />
    <script src="/loja-data.js" defer></script>
    <script src="/buy.js" defer></script>
    <script src="/loja.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>Escolha o que levar</h1>
      <p class="lead">
        Preço em dólar. No Brasil, o valor em reais acompanha o dólar do dia, e você paga em reais.
      </p>
      <label class="find" for="find">Buscar por nome ou código</label>
      <input id="find" type="search" autocomplete="off" maxlength="80" />
      <p class="status" id="count" role="status"></p>
      <p class="status" id="fx"></p>
      <p class="status error" id="notice" role="alert"></p>
      <div id="list"></div>
    </main>
    <footer class="foot">
      <span>DriveData</span>
      <a href="/acesso">Já comprei</a>
    </footer>
  </body>
